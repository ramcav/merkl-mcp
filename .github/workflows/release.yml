# Cut a merkl-mcp image release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Deliberately not triggered by a plain push: pushing the tag is the release
# decision, same as merkl-sdk's and merkl-trader's own release.yml.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} declares ${tag}, pyproject.toml declares ${pkg}"
            exit 1
          fi
          echo "VERSION=${pkg}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check merkl_mcp tests
          ruff format --check merkl_mcp tests
          pytest -q --timeout 60

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/ramcav/merkl-mcp:${{ env.VERSION }}
            ghcr.io/ramcav/merkl-mcp:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
